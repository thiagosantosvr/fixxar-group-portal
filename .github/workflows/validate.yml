name: Validate portal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run project verification
        run: npm run verify
      - name: Build static site
        run: npm run build
      - name: Check DreamHost Apache config is included
        run: test -f dist/.htaccess
      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixxar-group-portal-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
