name: Publicar FIXXAR GROUP na DreamHost

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamhost-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar PHP para validar a API
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Validar sintaxe PHP
        run: find server -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Executar verificações do projeto
        run: npm run verify

      - name: Gerar versão de produção
        run: npm run build

      - name: Montar arquivos para publicação
        run: |
          mkdir -p deploy/server
          cp -a dist/. deploy/
          cp -a server/. deploy/server/
          rm -f deploy/server/config.php
          test -f deploy/index.html
          test -f deploy/.htaccess

      - name: Instalar cliente SFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Publicar por SFTP na DreamHost
        env:
          DREAMHOST_FTP_SERVER: ${{ secrets.DREAMHOST_FTP_SERVER }}
          DREAMHOST_FTP_USERNAME: ${{ secrets.DREAMHOST_FTP_USERNAME }}
          DREAMHOST_FTP_PASSWORD: ${{ secrets.DREAMHOST_FTP_PASSWORD }}
          DREAMHOST_FTP_SERVER_DIR: ${{ secrets.DREAMHOST_FTP_SERVER_DIR }}
        run: |
          lftp -u "$DREAMHOST_FTP_USERNAME","$DREAMHOST_FTP_PASSWORD" "sftp://$DREAMHOST_FTP_SERVER:22" -e "
            set sftp:auto-confirm yes;
            set net:timeout 30;
            mirror --reverse --verbose --no-perms --exclude-glob server/config.php ./deploy/ $DREAMHOST_FTP_SERVER_DIR/;
            bye
          "
